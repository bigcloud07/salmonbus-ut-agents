<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>연어 UT 관찰실</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true">↗</span> 연어 <span>UT 관찰실</span></div>
    <span class="sync" id="sync" role="status">기록 확인 중</span>
  </header>
  <main>
    <section class="intro" aria-labelledby="title">
      <p class="eyebrow">SALMONBUS / USABILITY TEST</p>
      <h1 id="title">연어 UT 관찰실</h1>
      <p>페르소나가 본 화면과 그 순간의 발언을 함께 살펴보세요.</p>
    </section>
    <form class="surface launch" id="launch-form">
      <div class="launch-fields">
        <label>실행할 참가자
          <select id="run-persona">
            <option value="P1">P1 · 파일럿</option>
            <option value="P2">P2</option>
            <option value="P3">P3</option>
            <option value="all">전체 · P1, P2, P3</option>
          </select>
        </label>
        <label id="key-field">OpenAI API 키
          <input type="password" id="api-key" autocomplete="off" maxlength="512" placeholder="이 탭에서 사용할 키">
        </label>
        <button type="submit" class="primary" id="launch-button">UT 시작</button>
      </div>
      <p class="muted feedback" id="launch-feedback" role="status">운영 웹을 비회원으로 탐색합니다.</p>
    </form>
    <div class="workspace">
      <aside class="surface runs">
        <h2>실행 목록</h2>
        <div id="runs"></div>
      </aside>
      <section class="surface empty" id="empty">
        <h2>첫 실행을 기다리고 있어요</h2>
        <p>위에서 UT를 시작하면 여기에 기록이 나타납니다.</p>
      </section>
      <section id="detail" hidden aria-labelledby="run-title">
        <div class="surface run-header">
          <div><p class="eyebrow">선택한 실행</p><h2 id="run-title"></h2><p id="run-info"></p></div>
          <span class="badge" id="run-status"></span>
        </div>
        <nav class="tabs" aria-label="실행 기록 보기">
          <button type="button" data-view="activity" aria-pressed="true">사용 기록</button>
          <button type="button" data-view="interviews" aria-pressed="false">인터뷰</button>
          <button type="button" data-view="discussion" aria-pressed="false">그룹 대화</button>
          <button type="button" data-view="report" aria-pressed="false">리포트</button>
        </nav>
        <div id="activity" class="activity">
          <section class="surface preview" aria-labelledby="preview-title">
            <div class="section-head"><h3 id="preview-title">사용 화면</h3><button type="button" id="follow">최신 화면으로</button></div>
            <p id="frame-info">아직 캡처가 없습니다.</p>
            <div class="screen" id="screen"><img id="capture" alt="" hidden></div>
          </section>
          <section class="surface timeline" aria-labelledby="timeline-title">
            <div class="section-head">
              <h3 id="timeline-title">행동과 발언</h3>
              <label>참가자 <select id="participant"><option value="">전체</option></select></label>
            </div>
            <ol id="events"></ol>
          </section>
        </div>
        <section id="interviews" class="surface records" aria-labelledby="interviews-title" hidden>
          <h3 id="interviews-title">개별 인터뷰</h3>
          <form id="interview-form" class="interview-form">
            <label>질문할 참가자 <select id="interview-persona"></select></label>
            <label>추가 질문
              <textarea id="interview-question" maxlength="1000" rows="2" required placeholder="그 화면에서 무엇을 기대했나요?"></textarea>
            </label>
            <button type="submit" class="primary" id="interview-button">질문 보내기</button>
            <p class="muted feedback" id="interview-feedback" role="status"></p>
          </form>
          <div id="interview-records"></div>
        </section>
        <section id="discussion" class="surface records" aria-label="그룹 대화" hidden></section>
        <section id="report" class="surface records" aria-label="리포트" hidden></section>
      </section>
    </div>
  </main>
</body>
</html>
